{% extends 'base.html' %}

{% block title %}Google Maps Atölye Arama | FasonBul{% endblock %}

{% block content %}
<div class="container my-4">
    <!-- Üst Bilgi Başlığı -->
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h3 class="fw-bold mb-1">
                <i class="fa-solid fa-map-location-dot text-danger me-2"></i>Haritada Atölye Arama
            </h3>
            <p class="text-muted mb-0">Google Maps verileri üzerinden canlı atölye ve fason firma sonuçları.</p>
        </div>
        <a href="{% url 'workshop:list' %}" class="btn btn-outline-secondary">
            &larr; Ana Sayfaya Dön
        </a>
    </div>

    <!-- Arama Filtreleme Formu -->
    <div class="card p-3 mb-4 border-0 shadow-sm">
        <form method="GET" action="{% url 'workshop:map_search' %}" class="row g-3">
            <div class="col-md-5">
                <label class="form-label small fw-bold">Şehir / İlçe</label>
                <input type="text" name="city" value="{{ city }}" class="form-control" placeholder="Örn: İstanbul Zeytinburnu">
            </div>
            <div class="col-md-5">
                <label class="form-label small fw-bold">Kategori / Uzmanlık</label>
                <input type="text" name="category" value="{{ category }}" class="form-control" placeholder="Örn: Örme, Dikim, Ütü Paket">
            </div>
            <div class="col-md-2 d-flex align-items-end">
                <button type="submit" class="btn btn-danger w-100">
                    <i class="fa-solid fa-magnifying-glass me-1"></i> Haritada Ara
                </button>
            </div>
        </form>
    </div>

    <!-- Canlı Google Maps Ekranı -->
    <div class="card border-0 shadow-sm overflow-hidden" style="height: 600px;">
        <iframe
            width="100%"
            height="100%"
            style="border:0;"
            loading="lazy"
            allowfullscreen
            referrerpolicy="no-referrer-when-downgrade"
            src="https://www.google.com/maps?q={{ search_query|urlencode }}&output=embed">
        </iframe>
    </div>
</div>
{% endblock %}
